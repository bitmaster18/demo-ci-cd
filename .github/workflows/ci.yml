name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'

  workflow_dispatch:
  
permissions:
  contents: read

env:
  APP_NAME: demo-ci-cd
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Display environment information
        run: |
          echo "Application: $APP_NAME"
          echo "Java version: $JAVA_VERSION"
          java -version

      - name: Verify secret configuration
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Compile and package application
        run: ./gradlew clean assemble

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-ci-cd-jar
          path: build/libs/demo-ci-cd-0.0.1-SNAPSHOT.jar
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        include:
          - java: '17'
            label: 'Supported baseline'
          - java: '21'
            label: 'Compatibility check'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Display test configuration
        run: |
          echo "Java version: ${{ matrix.java }}"
          echo "Test type: ${{ matrix.label }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/test-results/test/
            build/reports/tests/test/

  verify-artifact:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download executable JAR
        uses: actions/download-artifact@v4
        with:
          name: demo-ci-cd-jar
          path: downloaded-artifact

      - name: List downloaded files
        run: ls -la downloaded-artifact

  docker:
    needs: verify-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download executable JAR
        uses: actions/download-artifact@v4
        with:
          name: executable-jar
          path: build/libs

      - name: Build Docker image
        run: docker build -t demo-ci-cd:${{ github.sha }} .