name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  APP_NAME: demo-ci-cd
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Display environment information
        run: |
          echo "Application: $APP_NAME"
          echo "Java version: $JAVA_VERSION"
          java -version

      - name: Verify secret configuration
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-ci-cd-jar
          path: build/libs/*.jar

  verify-artifact:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download executable JAR
        uses: actions/download-artifact@v4
        with:
          name: demo-ci-cd-jar
          path: downloaded-artifact

      - name: List downloaded files
        run: ls -la downloaded-artifact