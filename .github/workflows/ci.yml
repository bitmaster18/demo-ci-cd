name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test
        run: ./gradlew clean build

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: demo-ci-cd-jar
          path: build/libs/demo-ci-cd-0.0.1-SNAPSHOT.jar